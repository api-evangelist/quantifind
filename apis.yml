aid: quantifind
name: Quantifind
description: >-
  Quantifind is a financial crimes automation company founded in 2009 by physicists Ari
  Tuchman and John Stockton to extract meaningful risk signals from large, unstructured
  datasets. Its flagship SaaS platform, Graphyte, applies machine learning, natural language
  processing, and entity resolution to anti-money laundering (AML) and know-your-customer
  (KYC) compliance. Graphyte spans watchlist and sanctions screening, adverse media
  screening, enhanced due diligence, credit risk, and investigations, and is delivered
  through GraphyteSearch (an investigation application), GraphyteQueue (an AI-native case
  manager), GraphyteAPI (a synchronous REST risk-assessment API), and GraphyteBatch (batch
  screening). Quantifind serves Tier 1 and regional banks, digital banks, Fortune 50
  companies, and federal and defense agencies, and integrates with case-management systems
  such as Oracle FCCM. Backed by a16z.
